<ion-card class="ambulance-card">
  <!-- Image -->
  <div class="card-image">
    <img [src]="ambulance.imageUrl" [alt]="ambulance.name" />
    <div class="image-overlay">
      <ion-chip>
        <ion-icon [name]="getTypeIcon(ambulance.type)"></ion-icon>
        {{ getTypeLabel(ambulance.type) }}
      </ion-chip>
    </div>
  </div>

  <ion-card-content>
    <!-- Header -->
    <div class="card-header">
      <h2>{{ ambulance.name }}</h2>
      <ion-icon
        name="ellipse"
        class="status-icon"
        [class.available]="ambulance.status === 'AVAILABLE'">
      </ion-icon>
    </div>

    <!-- Description -->
    <p class="description">{{ ambulance.description }}</p>

    <ion-item-divider></ion-item-divider>

    <!-- Infos -->
    <div class="card-info">
      <div class="info-item">
        <ion-icon name="people-outline"></ion-icon>
        <span>{{ ambulance.capacity }} places</span>
      </div>
      <div class="info-item">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>{{ ambulance.year }}</span>
      </div>
      <div class="info-item">
        <ion-icon name="cube-outline"></ion-icon>
        <span>{{ ambulance.equipment.length }} équipements</span>
      </div>
    </div>

    <ion-item-divider></ion-item-divider>

    <!-- Pricing -->
    <div class="card-pricing">
      <div class="price-info">
        <span class="base-price">{{ ambulance.basePrice }} €</span>
        <span class="price-detail">+ {{ ambulance.pricePerKm }} €/km</span>
      </div>

      <ion-button color="primary" expand="block" (click)="onViewDetails()">
        <ion-icon name="arrow-forward-outline"></ion-icon>
        Voir détails
        <!-- <ion-icon slot="end" name="arrow-forward-outline"></ion-icon> -->
      </ion-button>
    </div>
  </ion-card-content>
</ion-card>
